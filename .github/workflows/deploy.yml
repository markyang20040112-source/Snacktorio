name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # 品質閘門：tsc + 資料 lint + 程式守門 + 回歸指紋。未通過則不部署。
      - name: Quality Gate (npm run check)
        run: |
          if git log -1 --format=%B | grep -q 'BASELINE:'; then
            echo "偵測到刻意修改標記 BASELINE:，在 CI 執行指紋與基準對齊..."
            npm run baseline
          fi
          npm run check

      # 基準檔（回歸指紋 / 守門基準）被修改時，本次推送的 commit 訊息必須含「BASELINE:」說明原因
      - name: Baseline Change Requires Explanation
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if git diff --name-only "$RANGE" | grep -qE '^scripts/check/(fingerprints|baseline)\.json$'; then
            if ! git log --format=%B "$RANGE" | grep -q 'BASELINE:'; then
              echo "::error::scripts/check 基準檔被修改，但 commit 訊息沒有「BASELINE: 原因」。請說明為何接受計算結果 / 基準的變更。"
              exit 1
            fi
          fi

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
